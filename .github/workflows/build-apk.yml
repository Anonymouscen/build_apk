name: Build Android APK

on:
  push:
    branches: [ main ] # 你可以根据实际情况修改分支名，比如 master 或 dev
  # 允许你在 GitHub 网页上手动触发打包
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. 检出代码
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. 配置 Node.js 环境 (适配 Vue 2)
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' # 如果你的项目要求特定的 Node 版本（如 16），可以自行调整
        cache: 'npm'

    # 3. 配置 JDK 17 (和你本地安装的 JDK 版本保持一致)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 4. 安装项目依赖
    - name: Install Dependencies
      run: npm install

    # 5. 执行 Vue 项目打包 并 同步到 Capacitor Android 目录
    - name: Build Web & Sync Capacitor
    run: npm run build && npx cap sync android
    env:
      NODE_OPTIONS: --openssl-legacy-provider

    # 6. 编译 Android Debug APK
    - name: Build Android APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    # 7. 上传编译好的 APK 到 GitHub Artifacts 供下载
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk